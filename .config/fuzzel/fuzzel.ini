icon-theme=Colloid-Purple-Catppuccin-Dark
width=50
lines=10
font=Iosevka:weight=bold:size=16
line-height=34
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
prompt="❯   "
show-actions=yes
icons-enabled=yes

[colors]
background=24273aff
text=cad3f5ff
prompt=c6a0f6ff
input=cad3f5ff
match=ed8796ff
selection=c6a0f6ff
selection-match=eb1b39ff
selection-text=24273aff
border=c6a0f6ff

[border]
width=3
radius=8
